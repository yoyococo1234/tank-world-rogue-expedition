<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1110">
  <title>坦克世界</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef6ed;
      --muted: #8fa399;
      --panel: rgba(14, 23, 21, .93);
      --panel-2: rgba(20, 34, 29, .93);
      --line: rgba(168, 196, 176, .18);
      --lime: #b7ef63;
      --amber: #f6c453;
      --red: #f16f5b;
      --blue: #74d4ff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 14% 8%, rgba(183, 239, 99, .12), transparent 25rem),
        radial-gradient(circle at 88% 84%, rgba(116, 212, 255, .1), transparent 30rem),
        linear-gradient(145deg, #080d0c, #101b18 55%, #0a1010);
      overflow-x: hidden;
    }
    button { font: inherit; }
    .game {
      width: min(100%, 1220px);
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(155deg, rgba(17, 29, 25, .96), rgba(8, 14, 13, .96));
      box-shadow: 0 30px 90px rgba(0, 0, 0, .48);
      backdrop-filter: blur(16px);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: 25px;
      background: linear-gradient(145deg, rgba(183, 239, 99, .2), rgba(72, 111, 72, .14));
      border: 1px solid rgba(183, 239, 99, .25);
      box-shadow: inset 0 1px rgba(255, 255, 255, .08);
    }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); letter-spacing: .08em; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .action.assist.active { color: #efffd3; border-color: rgba(183, 239, 99, .58); background: rgba(183, 239, 99, .15); box-shadow: 0 0 0 1px rgba(183, 239, 99, .12), 0 0 20px rgba(183, 239, 99, .12); }
    .action.boost.active { color: #fff2c7; border-color: rgba(246, 196, 83, .62); background: rgba(246, 196, 83, .16); box-shadow: 0 0 0 1px rgba(246, 196, 83, .12), 0 0 20px rgba(246, 196, 83, .14); }
    .action {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 12px;
      color: #dbe8dc;
      background: rgba(255, 255, 255, .035);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .action:hover { border-color: rgba(183, 239, 99, .42); background: rgba(183, 239, 99, .08); }
    .action:active { transform: translateY(1px); }
    .hud {
      display: grid;
      grid-template-columns: minmax(230px, 1.55fr) repeat(4, minmax(78px, .5fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .hud-card {
      min-height: 58px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(5, 11, 9, .58);
      box-shadow: inset 0 1px rgba(255, 255, 255, .025);
    }
    .health-card { min-width: 0; }
    .card-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .health-track {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, .08);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, .35);
    }
    .health-fill {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #68c75f, #b7ef63);
      box-shadow: 0 0 18px rgba(183, 239, 99, .35);
      transition: width .16s ease, background .16s ease;
    }
    .health-number { min-width: 3ch; font: 700 20px/1 "Cascadia Mono", "Consolas", monospace; text-align: right; }
    .stat { justify-content: center; text-align: center; }
    .stat strong { display: block; color: var(--lime); font: 800 23px/1 "Cascadia Mono", "Consolas", monospace; }
    .stat.alert strong { color: var(--amber); }
    .canvas-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(168, 196, 176, .17);
      border-radius: 16px;
      background: #101b18;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25), 0 18px 50px rgba(0, 0, 0, .3);
      isolation: isolate;
    }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #17221e; cursor: crosshair; touch-action: none; }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(4, 9, 8, .67);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .2s ease, visibility .2s ease;
    }
    .overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .overlay-card {
      width: min(94%, 780px);
      padding: 24px;
      border: 1px solid rgba(183, 239, 99, .26);
      border-radius: 18px;
      text-align: center;
      background: linear-gradient(155deg, rgba(20, 34, 29, .97), rgba(8, 15, 13, .98));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .52), inset 0 1px rgba(255, 255, 255, .06);
    }
    .kicker { display: inline-block; margin-bottom: 8px; color: var(--lime); font: 700 11px/1 "Cascadia Mono", "Consolas", monospace; letter-spacing: .2em; }
    .overlay h2 { margin: 0; font-size: clamp(27px, 5vw, 46px); letter-spacing: .08em; }
    .overlay p { margin: 12px auto 17px; max-width: 420px; color: #b7c7ba; line-height: 1.7; font-size: 14px; }
    .primary {
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      color: #17210d;
      font-weight: 900;
      letter-spacing: .05em;
      cursor: pointer;
      background: linear-gradient(135deg, #d8ff83, #9ed84d);
      box-shadow: 0 12px 30px rgba(183, 239, 99, .2);
      transition: transform .16s ease, filter .16s ease;
    }
    .primary:hover { filter: brightness(1.08); }
    .primary:active { transform: scale(.97); }
    .overlay-actions { display: flex; justify-content: center; gap: 10px; }
    .mode-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 16px 0 4px; }
    .mode-picker[hidden], .mode-note[hidden] { display: none !important; }
    .mode-option {
      min-height: 82px;
      padding: 11px 10px;
      border: 1px solid rgba(168, 196, 176, .18);
      border-radius: 12px;
      color: #cad9cc;
      text-align: left;
      cursor: pointer;
      background: rgba(255, 255, 255, .035);
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .mode-option:hover { border-color: rgba(183, 239, 99, .35); background: rgba(183, 239, 99, .06); }
    .mode-option:active { transform: translateY(1px); }
    .mode-option.active { border-color: rgba(183, 239, 99, .68); background: rgba(183, 239, 99, .13); box-shadow: inset 0 0 0 1px rgba(183, 239, 99, .08); }
    .mode-option strong { display: block; margin-bottom: 4px; color: #efffdc; font-size: 14px; }
    .mode-option span { display: block; color: #91a498; font-size: 11px; line-height: 1.45; }
    .mode-note { min-height: 18px; margin: 4px 0 14px; color: #a7baaa; font-size: 12px; }
    .reward-overlay {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(3, 8, 7, .78);
      backdrop-filter: blur(9px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .2s ease, visibility .2s ease;
    }
    .reward-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .reward-card {
      width: min(96%, 980px);
      padding: 22px;
      border: 1px solid rgba(116, 212, 255, .28);
      border-radius: 18px;
      background: linear-gradient(155deg, rgba(18, 35, 35, .98), rgba(7, 14, 14, .99));
      box-shadow: 0 26px 90px rgba(0, 0, 0, .58), inset 0 1px rgba(255, 255, 255, .06);
      text-align: center;
    }
    .reward-card h2 { margin: 3px 0 5px; font-size: clamp(23px, 4vw, 35px); letter-spacing: .06em; }
    .reward-card p { margin: 0 0 16px; color: #9cb2b3; font-size: 13px; }
    .reward-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .reward-option {
      min-height: 126px;
      padding: 14px 12px;
      border: 1px solid rgba(168, 196, 176, .2);
      border-radius: 14px;
      color: #e7f2e9;
      text-align: left;
      cursor: pointer;
      background: linear-gradient(145deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .02));
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .reward-option:hover { transform: translateY(-3px); border-color: rgba(116, 212, 255, .55); background: rgba(116, 212, 255, .08); }
    .reward-icon { display: block; margin-bottom: 7px; font-size: 25px; }
    .reward-option strong { display: block; margin-bottom: 5px; color: #dfff8a; }
    .reward-option span { display: block; color: #9cb0a2; font-size: 12px; line-height: 1.5; }
    .secondary {
      border: 1px solid rgba(168, 196, 176, .24);
      border-radius: 12px;
      padding: 12px 18px;
      color: #c8d7ca;
      font-weight: 800;
      cursor: pointer;
      background: rgba(255, 255, 255, .045);
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .secondary:hover { border-color: rgba(246, 196, 83, .45); background: rgba(246, 196, 83, .08); }
    .secondary:active { transform: scale(.97); }
    .overlay-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 13px; margin-top: 16px; color: #84988b; font-size: 12px; }
    .overlay-meta span { white-space: nowrap; }
    .touch-controls { display: none; }
    .joystick {
      position: absolute;
      bottom: 14px;
      width: 104px;
      height: 104px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 50%;
      background: rgba(5, 10, 9, .42);
      box-shadow: inset 0 0 24px rgba(0, 0, 0, .34);
      pointer-events: none;
    }
    .joystick.move { left: 16px; }
    .joystick.aim { right: 16px; }
    .joystick-thumb {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      margin: -22px;
      border-radius: 50%;
      background: rgba(183, 239, 99, .58);
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: 0 5px 18px rgba(0, 0, 0, .32);
      transform: translate(0, 0);
    }
    .aim .joystick-thumb { background: rgba(116, 212, 255, .58); }
    .joystick-label { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); color: rgba(238, 246, 237, .7); font-size: 11px; white-space: nowrap; }
    .tips { margin: 10px 4px 0; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }
    kbd { padding: 2px 6px; border-radius: 6px; color: #dcebdd; font: 700 11px/1.4 "Cascadia Mono", "Consolas", monospace; border: 1px solid rgba(168, 196, 176, .2); background: rgba(255, 255, 255, .05); }
    @media (max-width: 760px) {
      body { padding: 8px; align-items: start; }
      .game { padding: 10px; border-radius: 16px; }
      .topbar { align-items: flex-start; }
      .brand-mark { width: 40px; height: 40px; font-size: 21px; border-radius: 12px; }
      .subtitle { display: none; }
      .action { padding: 8px 9px; font-size: 12px; }
      .hud { grid-template-columns: repeat(3, 1fr); }
      .health-card { grid-column: 1 / -1; }
      .hud-card { min-height: 50px; padding: 7px 9px; }
      .stat strong { font-size: 19px; }
      .health-number { font-size: 17px; }
      .mode-picker, .reward-options { grid-template-columns: 1fr; }
      .mode-option { min-height: 64px; }
      .reward-card { padding: 15px; }
      .tips { display: none; }
    }
    @media (orientation: portrait) and (max-width: 760px) {
      .canvas-shell { overflow: visible; }
      .overlay, .reward-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: block;
        padding: 12px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .overlay-card, .reward-card {
        width: min(100%, 620px);
        max-height: none;
        margin: 10px auto;
      }
      .mode-picker, .reward-options { grid-template-columns: 1fr; }
    }
    @media (pointer: coarse) {
      .touch-controls { display: block; position: absolute; inset: 0; pointer-events: none; }
      .joystick { pointer-events: auto; }
      canvas { cursor: default; }
    }
    @media (min-aspect-ratio: 4 / 3) and (max-height: 620px) {
      html, body { height: 100%; overflow: hidden; }
      body { padding: 4px; align-items: start; }
      .game { height: calc(100dvh - 8px); padding: 7px; display: flex; flex-direction: column; border-radius: 14px; }
      .topbar { margin-bottom: 5px; gap: 8px; }
      .brand { gap: 7px; }
      .brand-mark { width: 34px; height: 34px; font-size: 18px; border-radius: 10px; }
      h1 { font-size: 18px; }
      .subtitle { display: none; }
      .actions { gap: 4px; }
      .action { padding: 5px 7px; font-size: 11px; border-radius: 8px; }
      .hud { grid-template-columns: minmax(160px, 1.5fr) repeat(4, minmax(58px, .45fr)); gap: 5px; margin-bottom: 5px; }
      .hud-card { min-height: 40px; padding: 5px 7px; border-radius: 9px; }
      .card-label { font-size: 8px; margin-bottom: 2px; }
      .health-track { height: 8px; }
      .health-number { font-size: 15px; }
      .stat strong { font-size: 16px; }
      .canvas-shell { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px; }
      canvas { width: auto; height: min(calc(100dvh - 112px), 56.25vw); max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; }
      .tips { display: none; }
      .joystick { width: 82px; height: 82px; bottom: 8px; }
      .joystick.move { left: 10px; }
      .joystick.aim { right: 10px; }
      .joystick-thumb { width: 36px; height: 36px; margin: -18px; }
      .joystick-label { bottom: -18px; font-size: 9px; }
      .overlay-card, .reward-card { max-height: calc(100dvh - 16px); overflow: auto; padding: 13px; }
      .overlay h2 { font-size: 26px; }
      .overlay p { margin: 7px auto 10px; font-size: 12px; }
      .primary, .secondary { padding: 8px 13px; }
      .reward-card h2 { font-size: 22px; }
      .reward-card p { margin-bottom: 8px; font-size: 11px; }
      .reward-options { grid-template-columns: repeat(3, 1fr); }
      .reward-option { min-height: 88px; padding: 8px; }
      .reward-icon { font-size: 18px; margin-bottom: 3px; }
      .reward-option span { font-size: 10px; }
    }
    body.landscape-ui .game { position: relative; }
    body.landscape-ui .canvas-shell {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 0;
      border-radius: 14px;
    }
    body.landscape-ui canvas {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      aspect-ratio: auto;
    }
    body.landscape-ui .topbar {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 8px;
      z-index: 20;
      margin: 0;
      pointer-events: none;
    }
    body.landscape-ui .topbar .actions { pointer-events: auto; }
    body.landscape-ui .brand { pointer-events: none; }
    body.landscape-ui .hud {
      position: absolute;
      top: 46px;
      left: 8px;
      right: 8px;
      z-index: 19;
      margin: 0;
      pointer-events: none;
      opacity: .94;
    }
    html.force-landscape-root, body.force-landscape {
      width: 100%; height: 100%; overflow: hidden; background: #030706;
    }
    body.force-landscape .game {
      position: fixed;
      top: 50%;
      left: 50%;
      width: calc(100dvh - 8px);
      height: calc(100dvw - 8px);
      padding: 7px;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      transform: translate(-50%, -50%) rotate(90deg);
      transform-origin: center center;
    }
    body.force-landscape .topbar { margin-bottom: 5px; gap: 8px; }
    body.force-landscape .brand { gap: 7px; }
    body.force-landscape .brand-mark { width: 34px; height: 34px; font-size: 18px; border-radius: 10px; }
    body.force-landscape h1 { font-size: 18px; }
    body.force-landscape .subtitle { display: none; }
    body.force-landscape .actions { gap: 4px; }
    body.force-landscape .action { padding: 5px 7px; font-size: 11px; border-radius: 8px; }
    body.force-landscape .hud { grid-template-columns: minmax(160px, 1.5fr) repeat(4, minmax(58px, .45fr)); gap: 5px; margin-bottom: 5px; }
    body.force-landscape .hud-card { min-height: 40px; padding: 5px 7px; border-radius: 9px; }
    body.force-landscape .card-label { font-size: 8px; margin-bottom: 2px; }
    body.force-landscape .health-track { height: 8px; }
    body.force-landscape .health-number { font-size: 15px; }
    body.force-landscape .stat strong { font-size: 16px; }
    body.force-landscape .canvas-shell { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px; }
    body.force-landscape canvas { width: 100%; height: 100%; max-width: none; max-height: none; aspect-ratio: auto; }
    body.force-landscape .tips { display: none; }
    body.force-landscape .joystick { width: 82px; height: 82px; bottom: 8px; }
    body.force-landscape .joystick.move { left: 10px; }
    body.force-landscape .joystick.aim { right: 10px; }
    body.force-landscape .joystick-thumb { width: 36px; height: 36px; margin: -18px; }
    body.force-landscape .joystick-label { bottom: -18px; font-size: 9px; }
    body.force-landscape .overlay-card, body.force-landscape .reward-card { max-height: calc(100dvw - 16px); overflow: auto; padding: 13px; }
    body.force-landscape .overlay h2 { font-size: 26px; }
    body.force-landscape .overlay p { margin: 7px auto 10px; font-size: 12px; }
    body.force-landscape .primary, body.force-landscape .secondary { padding: 8px 13px; }
    body.force-landscape .reward-card h2 { font-size: 22px; }
    body.force-landscape .reward-card p { margin-bottom: 8px; font-size: 11px; }
    body.force-landscape .reward-options { grid-template-columns: repeat(3, 1fr); }
    body.force-landscape .reward-option { min-height: 88px; padding: 8px; }
    body.force-landscape .reward-icon { font-size: 18px; margin-bottom: 3px; }
    body.force-landscape .reward-option span { font-size: 10px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="坦克世界小游戏">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">◉</div>
        <div>
          <h1>坦克世界</h1>
          <p class="subtitle">俯视角装甲对抗 · 肉鸽远征 30 关版</p>
        </div>
      </div>
      <div class="actions">

        <button class="action assist" id="autoFireToggle" type="button" aria-label="切换自动开火" aria-pressed="false">自动开火 关</button>
        <button class="action exit" id="exitModeToggle" type="button" aria-label="退出当前模式">退出模式</button>
        <button class="action" id="fullscreenToggle" type="button" aria-label="横屏全屏">横屏全屏</button>
        <button class="action" id="soundToggle" type="button" aria-label="切换音效">🔊 音效</button>
        <button class="action" id="pauseToggle" type="button" aria-label="暂停游戏">暂停</button>
      </div>
    </header>
    <section class="hud" aria-label="战斗状态">
      <div class="hud-card health-card">
        <div style="flex:1;min-width:0">
          <span class="card-label">装甲值</span>
          <div class="health-track"><i class="health-fill" id="healthFill"></i></div>
        </div>
        <strong class="health-number" id="healthNumber">100</strong>
      </div>
      <div class="hud-card stat"><div><span class="card-label">波次</span><strong id="waveValue">1</strong></div></div>
      <div class="hud-card stat"><div><span class="card-label">得分</span><strong id="scoreValue">0000</strong></div></div>
      <div class="hud-card stat"><div><span class="card-label">模式</span><strong id="boostValue">普通</strong></div></div>
      <div class="hud-card stat alert"><div><span class="card-label">敌情</span><strong id="enemyValue">00</strong></div></div>
    </section>
    <div class="canvas-shell">
      <canvas id="gameCanvas" width="1600" height="900" role="img" aria-label="坦克世界战斗区域"></canvas>
      <div class="overlay show" id="overlay">
        <div class="overlay-card">
          <span class="kicker" id="overlayKicker">ARENA // SURVIVAL</span>
          <h2 id="overlayTitle">坦克世界</h2>
          <p id="overlayText">驾驶你的坦克，利用掩体消灭敌军。每次击毁都会累积战功，波次越高，敌人越强。</p>

          ctx.globalAlpha = clamp(item.life / item.maxLife, 0, 1);
          ctx.fillStyle = item.color;
          ctx.fillText(item.text, item.x, item.y);
        }
        ctx.restore();
      }
      function drawCrosshair() {
        if (mode !== 'playing' || lastInputTouch) return;
        const aim = currentAimPoint();
        ctx.save();
        ctx.strokeStyle = 'rgba(223, 255, 138, .72)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(aim.x, aim.y, 12, 0, Math.PI * 2);
        ctx.moveTo(aim.x - 19, aim.y); ctx.lineTo(aim.x - 7, aim.y);
        ctx.moveTo(aim.x + 7, aim.y); ctx.lineTo(aim.x + 19, aim.y);
        ctx.moveTo(aim.x, aim.y - 19); ctx.lineTo(aim.x, aim.y - 7);
        ctx.moveTo(aim.x, aim.y + 7); ctx.lineTo(aim.x, aim.y + 19);
        ctx.stroke();
        ctx.restore();
      }
      function drawToast() {
        if (!toast) return;
        const alpha = Math.min(1, Math.min(toast.time, toast.max - toast.time) * 4);
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.textAlign = 'center';
        ctx.font = '800 34px "Microsoft YaHei UI", "Microsoft YaHei", sans-serif';
        ctx.fillStyle = 'rgba(4, 10, 8, .72)';
        roundedRectPath(WORLD.w / 2 - 190, 44, 380, 62, 14); ctx.fill();
        ctx.strokeStyle = 'rgba(183, 239, 99, .32)';
        ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#e7ffc2';
        ctx.fillText(toast.text, WORLD.w / 2, 84);
        ctx.restore();
      }
      function render() {
        ctx.save();
        if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
        drawBackground();
        drawTracks();
        drawHazards();
        drawObstacles();
        drawCrates();
        drawPickups();
        drawParticles();
        drawBullets();
        if (player) drawTank(player, true);
        for (const enemy of enemies) drawTank(enemy, false);
        drawFloatingTexts();
        drawCrosshair();
        drawToast();
        ctx.restore();
      }
      function addTrack(tank, dt) {
        trackTimer -= dt;
        if (trackTimer > 0) return;
        trackTimer = .08;
        tracks.push({ x: tank.x, y: tank.y, angle: tank.hullAngle, life: 7, maxLife: 7 });
        if (tracks.length > MAX_TRACKS) tracks.shift();
      }
      function updateTracks(dt) {
        for (const track of tracks) track.life -= dt;
        tracks = tracks.filter((track) => track.life > 0);
      }
      function enablePerformanceGuard() {
        if (lowQuality) return;
        lowQuality = true;
        if (particles.length > 180) particles.length = 180;
        tracks.length = Math.min(tracks.length, 40);
        showToast('性能保护已启用', 1.8);
      }
      function loop(now) {
        requestAnimationFrame(loop);
        const dt = Math.min(.034, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        try {
          const frameStart = performance.now();
          if (mode === 'playing') {
            update(dt);
            if (player) addTrack(player, dt);
            for (const enemy of enemies) addTrack(enemy, dt);
            updateTracks(dt);
          }
          render();
          const frameCost = performance.now() - frameStart;
          if (frameCost > 42) slowFrameCount += 1;
          else slowFrameCount = Math.max(0, slowFrameCount - 1);
          if (!lowQuality && slowFrameCount >= 12) enablePerformanceGuard();
        } catch (error) {
          console.error('Game loop error:', error);
          slowFrameCount = 0;
          if (mode !== 'menu') {
            mode = 'paused';
            mouseFire.active = false;
            touchAim.firing = false;
            showOverlay({
              kicker: 'SAFE MODE',
              title: '已自动暂停',
              text: '检测到运行异常，游戏已暂停，避免继续卡死。点击继续后会自动启用性能保护。',
              button: '继续战斗',
              primaryAction: 'resume'
            });
            enablePerformanceGuard();
            updatePauseButton();
          }
        }
      }
      function updatePointerAim(event) {
        const rect = canvas.getBoundingClientRect();
        mouseAim.x = clamp((event.clientX - rect.left) / rect.width * WORLD.w, 0, WORLD.w);
        mouseAim.y = clamp((event.clientY - rect.top) / rect.height * WORLD.h, 0, WORLD.h);
      }
      function setupJoystick(element, callback) {
        const thumb = element.querySelector('.joystick-thumb');
        const radius = 38;
        let pointerId = null;
        function update(event) {
          const rect = element.getBoundingClientRect();
          let dx = event.clientX - (rect.left + rect.width / 2);
          let dy = event.clientY - (rect.top + rect.height / 2);
          const length = Math.hypot(dx, dy);
          if (length > radius) { dx = dx / length * radius; dy = dy / length * radius; }
          thumb.style.transform = `translate(${dx}px, ${dy}px)`;
          callback(dx / radius, dy / radius, true);
        }
        function end(event) {
          if (pointerId !== event.pointerId) return;
          pointerId = null;
          thumb.style.transform = 'translate(0, 0)';
          callback(0, 0, false);
        }
        element.addEventListener('pointerdown', (event) => {
          lastInputTouch = true;
          pointerId = event.pointerId;
          element.setPointerCapture(pointerId);
          update(event);
        });
        element.addEventListener('pointermove', (event) => { if (pointerId === event.pointerId) update(event); });
        element.addEventListener('pointerup', end);
        element.addEventListener('pointercancel', end);
      }
      window.addEventListener('keydown', (event) => {
        const id = keyId(event);
        if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'space'].includes(id)) event.preventDefault();
        keys.add(id);
        if (id === 'p' && (mode === 'playing' || mode === 'paused')) togglePause();
        if (id === 'r' && mode !== 'menu') startGame();
        if (id === 'f' && !event.repeat) toggleAutoFire();

      });
      window.addEventListener('keyup', (event) => keys.delete(keyId(event)));
      window.addEventListener('blur', () => {
        keys.clear();
        mouseFire.active = false;
        touchAim.firing = false;
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'playing') pauseGame(); });
      canvas.addEventListener('pointermove', (event) => {
        if (event.pointerType === 'mouse') {
          lastInputTouch = false;
          updatePointerAim(event);
        }
      });
      canvas.addEventListener('pointerdown', (event) => {
        if (event.pointerType !== 'mouse') return;
        audio.init();
        if (event.button === 0) {
          lastInputTouch = false;
          updatePointerAim(event);
          mouseFire.active = true;
        }
      });
      window.addEventListener('pointerup', (event) => { if (event.pointerType === 'mouse' && event.button === 0) mouseFire.active = false; });
      canvas.addEventListener('contextmenu', (event) => event.preventDefault());
      function requestExitMode() {
        if (mode === 'menu' || mode === 'exitPrompt') return;
        exitReturnMode = mode;
        mouseFire.active = false;
        touchAim.firing = false;
        mode = 'exitPrompt';
        showOverlay({
          kicker: 'EXIT MODE',
          title: '退出当前模式？',
          text: '当前进度会结束并返回模式选择。普通、增益和肉鸽模式可以重新选择。',
          button: '退出并返回',
          primaryAction: 'exit-mode',
          secondary: '继续游戏',
          secondaryAction: 'cancel-exit'
        });
      }
      function confirmExitMode() {
        rewardOverlay.classList.remove('show');
        selectedMode = activeMode;
        activeMode = 'normal';
        boostModeEnabled = false;
        resetWorld();
        showMainMenu();
      }
      function cancelExitMode() {
        if (exitReturnMode === 'paused') {
          mode = 'paused';
          showOverlay({ kicker: 'BATTLE PAUSED', title: '战斗暂停', text: '战场已经冻结。按 P 或点击按钮继续战斗。', button: '继续战斗', primaryAction: 'resume' });
          updatePauseButton();
        } else {
          mode = 'playing';
          hideOverlay();
          updatePauseButton();
          lastTime = performance.now();
        }
      }
      primaryButton.addEventListener('click', () => {
        const action = primaryButton.dataset.action;
        if (action === 'enable-boost') enableBoostMode();
        else if (action === 'exit-mode') confirmExitMode();
        else if (action === 'resume' || mode === 'paused') resumeGame();
        else { startGame(); }
      });
      secondaryButton.addEventListener('click', () => {
        if (secondaryButton.dataset.action === 'cancel-boost') cancelBoostWarning();
        if (secondaryButton.dataset.action === 'cancel-exit') cancelExitMode();
      });
      exitModeToggle.addEventListener('click', requestExitMode);
      pauseToggle.addEventListener('click', togglePause);
      autoFireToggle.addEventListener('click', toggleAutoFire);
      modeButtons.forEach((button) => button.addEventListener('click', () => chooseMode(button.dataset.mode)));
      function syncForcedLandscape() {
        const portrait = matchMedia('(orientation: portrait)').matches;
        const touch = navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches;
        const wideViewport = matchMedia('(min-aspect-ratio: 4 / 3)').matches && innerHeight <= 620;
        const force = landscapeAssistRequested && touch && portrait;
        document.documentElement.classList.toggle('force-landscape-root', force);
        document.body.classList.toggle('force-landscape', force);
        document.body.classList.toggle('landscape-ui', force || wideViewport);
        fullscreenToggle.textContent = document.body.classList.contains('force-landscape')
          ? '退出横屏'
          : document.fullscreenElement ? '退出全屏' : '横屏全屏';
      }
      async function enterLandscapeFullscreen() {
        landscapeAssistRequested = true;
        if (navigator.maxTouchPoints <= 0 && !matchMedia('(pointer: coarse)').matches) return;
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            try { await screen.orientation.lock('landscape'); } catch (_) {}
          }
        } catch (_) {}
        window.setTimeout(syncForcedLandscape, 180);
      }
      async function toggleFullscreen() {
        if (document.body.classList.contains('force-landscape')) {
          landscapeAssistRequested = false;
          syncForcedLandscape();
          if (document.fullscreenElement && document.exitFullscreen) {
            try { await document.exitFullscreen(); } catch (_) {}
          }
          return;
        }
        try {
          if (!document.fullscreenElement) await enterLandscapeFullscreen();
          else if (document.exitFullscreen) {
            landscapeAssistRequested = false;
            await document.exitFullscreen();
          }
        } catch (_) {}
        syncForcedLandscape();
      }
      document.addEventListener('fullscreenchange', syncForcedLandscape);
      window.addEventListener('resize', syncForcedLandscape);
      window.addEventListener('orientationchange', syncForcedLandscape);      fullscreenToggle.addEventListener('click', toggleFullscreen);
      soundToggle.addEventListener('click', () => {
        audio.enabled = !audio.enabled;
        soundToggle.textContent = audio.enabled ? '🔊 音效' : '🔇 静音';
        if (audio.enabled) audio.init();
      });
      setupJoystick(moveStick, (x, y) => { touchMove.x = x; touchMove.y = y; });
      setupJoystick(aimStick, (x, y, active) => {
        touchAim.x = x;
        touchAim.y = y;
        touchAim.active = active && Math.hypot(x, y) > .12;
        touchAim.firing = touchAim.active;
        if (audio.enabled) audio.init();
      });
      resetWorld();
      updateAutoFireButton();
      updateModePicker();
      showMainMenu();
      syncForcedLandscape();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
